name: Documentation preview
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:docs
      - run: npm run build:examples
      - uses: actions/upload-artifact@v4
        with:
          name: oxygen-docs-demo
          path: |
            docs-dist/
            examples-dist/
